[build]
  publish = "public"
  command = "npm run build"

# The Video.js 8 API reference, built from the video.js 8.x branch and deployed to its own Netlify site, is served here
# under /api so the legacy docs live on one host. Its pages use relative links, which resolve under /api/ from every
# page except the bare /api, so that one goes to the index page.
[[redirects]]
  from = "/api"
  to = "/api/index.html"
  status = 301
  force = true

# The API reference used to host the guides as tutorial pages. Its own redirects for them point at videojs.com, so
# answer them here in one hop.
[[redirects]]
  from = "/api/tutorial-angular.html"
  to = "/guides/angular/"
  status = 301
  force = true

